# generated by grippd 0.1.0 from grippd.yaml. Don't edit: change grippd.yaml and grippd regenerates this file.
# Every push to main is checked, built and handed to grippd. grippd's cloud does the rest,
# in order: infrastructure, migrations, deploys to staging, health checks, and rollback if
# one fails. A v* tag promotes the build staging is running to production, byte for byte;
# grippd sees the tag itself, so nothing runs here for it.
name: Ship
on:
  push:
    branches: [main]
permissions:
  contents: read
  id-token: write
concurrency:
  group: ship
  cancel-in-progress: false
env:
  GRIPPD_PROJECT: docs-site
jobs:
  checks:
    uses: ./.github/workflows/grippd-checks.yml

  ship:
    needs: checks
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - name: Mint an upload key for this commit (valid 15 minutes; it can't deploy anything)
        run: .github/grippd/mint.sh repo staging upload
      - name: Build and upload docs-site
        run: |
          bun run build
          .github/grippd/ship.sh artifact docs-site . dist
      - name: Hand this commit to grippd
        run: .github/grippd/ship.sh ready
