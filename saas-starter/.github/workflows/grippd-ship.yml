# generated by grippd 0.1.0 from grippd.yaml. Don't edit: change grippd.yaml and grippd regenerates this file.
# Every push to main is checked, built and handed to grippd. grippd's cloud does the rest,
# in order: infrastructure, migrations, deploys to staging, health checks, and rollback if
# one fails. A v* tag promotes the builds staging is running to production, byte for byte;
# grippd sees the tag itself, so nothing runs here for it.
name: Ship
on:
  push:
    branches: [main]
permissions:
  contents: read
  id-token: write
concurrency:
  group: ship
  cancel-in-progress: false
env:
  GRIPPD_PROJECT: saas-starter
  TURBO_API: https://api.grippd.sh/v1/turbo
  TURBO_TEAM: saas-starter
  TURBO_TELEMETRY_DISABLED: "1"
jobs:
  checks:
    uses: ./.github/workflows/grippd-checks.yml

  ship:
    needs: checks
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - name: Mint an upload key for this commit (valid 15 minutes; it can't deploy anything)
        run: .github/grippd/mint.sh repo staging upload
      - id: graph
        name: Ask Turborepo which apps this push affects
        env:
          TURBO_SCM_BASE: ${{ github.event.before }}
        run: |
          pkgs=$(bunx turbo ls --affected --output=json)
          has() { jq -e --arg n "$1" '.packages.items | any(.name == $n)' <<<"$pkgs" >/dev/null && echo true || echo false; }
          {
            echo "web=$(has @saas-starter/web)"
            echo "worker=$(has @saas-starter/worker)"
            echo "docs=$(has @saas-starter/docs)"
            echo "migrations=$(has @saas-starter/db)"
          } >> "$GITHUB_OUTPUT"
      - name: Build and upload web
        if: steps.graph.outputs.web == 'true'
        run: |
          bunx turbo run build --filter=@saas-starter/web
          .github/grippd/ship.sh artifact web apps/web .svelte-kit/cloudflare
      - name: Build and upload worker
        if: steps.graph.outputs.worker == 'true'
        run: |
          bunx turbo run build --filter=@saas-starter/worker
          .github/grippd/ship.sh artifact worker apps/worker
      - name: Build and upload docs
        if: steps.graph.outputs.docs == 'true'
        run: |
          bunx turbo run build --filter=@saas-starter/docs
          .github/grippd/ship.sh artifact docs apps/docs dist
      - name: Upload migrations
        if: steps.graph.outputs.migrations == 'true'
        run: .github/grippd/ship.sh migrations packages/db/migrations
      - name: Hand this commit to grippd
        run: .github/grippd/ship.sh ready
