# generated by grippd 0.1.0 from grippd.yaml. Don't edit: change grippd.yaml and grippd regenerates this file.
# Pull requests, and every push to main before it ships (grippd-ship.yml calls this).
# Turborepo runs the tasks for the packages a change affects, sharing its cache with every
# other job and every developer through grippd.
name: Checks
on:
  pull_request:
  workflow_call:
permissions:
  contents: read
  id-token: write
env:
  GRIPPD_PROJECT: my-product
  TURBO_API: https://api.grippd.sh/v1/turbo
  TURBO_TEAM: my-product
  TURBO_TELEMETRY_DISABLED: "1"
  # On a push, compare with what was there before; pull requests use their base branch.
  TURBO_SCM_BASE: ${{ github.event.before }}
jobs:
  checks:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - name: Generated files are untouched
        run: sha256sum --check --quiet grippd.lock
      - run: bun run fmt:check
      - name: Mint a Turborepo cache key (valid 15 minutes)
        run: .github/grippd/mint.sh repo ci cache
      - name: Types, lint, tests and build for affected packages
        run: bunx turbo run check lint test build --affected
